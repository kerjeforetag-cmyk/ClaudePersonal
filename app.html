<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mimra — the sales hub</title>
<meta name="description" content="Mimra: customer hubs, generated presentations and market intelligence for B2B sales managers." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%23c96442'/><path d='M16 45 V31 a8.5 8.5 0 0 1 17 0 V45 M33 45 V31 a8.5 8.5 0 0 1 17 0 V45' fill='none' stroke='white' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/><circle cx='50' cy='17' r='4.4' fill='white'/></svg>" />
<link rel="stylesheet" href="assets/styles.css" />
</head>
<body>

<!-- login -->
<div class="login ambient" id="login">
  <div class="login-card">
    <svg class="login-mark" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="var(--accent)"/><path d="M16 45 V31 a8.5 8.5 0 0 1 17 0 V45 M33 45 V31 a8.5 8.5 0 0 1 17 0 V45" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="50" cy="17" r="4.4" fill="#fff"/></svg>
    <div class="login-logo">mim<em>ra</em></div>
    <p class="login-sub">Your customers, your prices, your presentations — one hub.</p>
    <input type="email" id="login-email" placeholder="work email" value="alex@nordcell.se" autocomplete="off" />
    <input type="password" placeholder="password" value="••••••••••" autocomplete="off" />
    <button class="btn primary" id="login-btn">Sign in to NordCell Power</button>
    <p class="fine">Demo workspace · app.mimra.se · <a href="index.html" style="color:var(--accent-ink)">what is Mimra? →</a></p>
  </div>
</div>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="logo"><svg class="logo-mark" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="var(--accent)"/><path d="M16 45 V31 a8.5 8.5 0 0 1 17 0 V45 M33 45 V31 a8.5 8.5 0 0 1 17 0 V45" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="50" cy="17" r="4.4" fill="#fff"/></svg><span>mim<em>ra</em></span></div>
    <div class="logo-sub">NORDCELL POWER AB</div>
    <nav id="nav"></nav>
    <div class="nav-spacer"></div>
    <div class="side-user">
      <div class="avatar" id="user-avatar">–</div>
      <div><b id="user-name">–</b><span id="user-role">–</span></div>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="menu-btn" id="menu-btn" aria-label="Menu">☰</button>
      <div class="crumb" id="crumb"><b>Dashboard</b></div>
      <div class="grow"></div>
      <div class="search" id="search-box">⌕ <input id="global-search" placeholder="Search customers, prices, people…  Ctrl+K" autocomplete="off" />
        <div class="search-results" id="search-results" hidden></div>
      </div>
      <button class="btn ghost sm" id="theme-btn" title="Toggle theme" aria-label="Toggle light or dark theme" aria-pressed="false">🌙</button>
      <div style="position:relative" id="notif-wrap">
        <button class="btn ghost sm" id="notif-btn" title="Notifications">🔔<span class="notif-dot" id="notif-dot" hidden></span></button>
        <div class="notif-panel" id="notif-panel" hidden></div>
      </div>
      <button class="btn ghost sm" id="help-toggle" title="Show help notes again">? Help</button>
    </div>
    <main class="content" id="view" aria-live="polite"></main>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="deck-overlay" id="deck-overlay" hidden>
  <div class="deck-bar">
    <b id="deck-title">Deck preview</b>
    <span class="grow"></span>
    <button class="btn sm" id="deck-download" style="background:#efede4;color:#1a1915">Download HTML</button>
    <button class="deck-close" id="deck-close" aria-label="Close">×</button>
  </div>
  <iframe id="deck-frame" title="Generated presentation"></iframe>
</div>

<div class="modal-wrap" id="modal-wrap" hidden>
  <div class="modal" id="modal"></div>
</div>
<input type="file" id="import-file" accept="application/json,.json" hidden />

<script src="assets/data.js"></script>
<script src="assets/generator.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
